# OTOMATIK ÜRETİLDİ - elle düzenlemeyin.
# Kaynak: /home/claude/sigma_work/source_rules/cowrie/cowrie_file_download.yml
# Üretici: convert_sigma_rules.py
id: 9d0e1f2a-3b4c-4d5e-9f0a-1b2c3d4e5f6a
name: Cowrie Honeypot - File Download Captured
level: 15
size: '>0'
active: true
author:
- KyloLab SOC
group: cowrie
tags:
- attack.command_and_control
- attack.t1105
description: 'Cowrie, bir oturumda saldırganın indirmeye çalıştığı bir dosyayı

  (genellikle bir malware örneği) yakaladı. Bu, sadece komut girişini

  değil, gerçek bir dosya transferi teşebbüsünü gösterir ve dosya

  örneğinin analiz için Cowrie''nin dl/ dizininde saklandığı anlamına gelir.'
sigma: false
data:
  source_sigma_id: 9d0e1f2a-3b4c-4d5e-9f0a-1b2c3d4e5f6a
rule: |-
  {
    "query": {
      "bool": {
        "must": [
          {
            "query_string": {
              "query": "data.eventid:cowrie.session.file_download",
              "analyze_wildcard": true
            }
          }
        ],
        "filter": [
          {
            "range": {
              "@timestamp": {
                "gte": "{{ startime }}",
                "lte": "{{ endtime }}",
                "format": "epoch_second"
              }
            }
          }
        ]
      }
    }
  }
