---
- name: Validate local_rules.xml is well-formed XML
  ansible.builtin.command:
    cmd: "python3 -c \"import xml.etree.ElementTree as ET; ET.parse('{{ role_path }}/files/local_rules.xml')\""
  delegate_to: localhost
  become: false
  changed_when: false

- name: Validate local_decoder.xml is well-formed XML
  ansible.builtin.command:
    cmd: "python3 -c \"import xml.etree.ElementTree as ET; ET.parse('{{ role_path }}/files/local_decoder.xml')\""
  delegate_to: localhost
  become: false
  changed_when: false

- name: Deploy local_rules.xml (custom detection rules, incl. FortiGate)
  ansible.builtin.copy:
    src: local_rules.xml
    dest: /var/ossec/etc/rules/local_rules.xml
    owner: wazuh
    group: wazuh
    mode: '0660'
  notify: restart wazuh-manager

- name: Deploy local_decoder.xml (custom decoders)
  ansible.builtin.copy:
    src: local_decoder.xml
    dest: /var/ossec/etc/decoders/local_decoder.xml
    owner: wazuh
    group: wazuh
    mode: '0660'
  notify: restart wazuh-manager

- name: Deploy custom-alienvault integration wrapper
  ansible.builtin.copy:
    src: custom-alienvault
    dest: /var/ossec/integrations/custom-alienvault
    owner: root
    group: wazuh
    mode: '0755'

- name: Deploy custom-alienvault.py integration script
  ansible.builtin.copy:
    src: custom-alienvault.py
    dest: /var/ossec/integrations/custom-alienvault.py
    owner: root
    group: wazuh
    mode: '0755'
