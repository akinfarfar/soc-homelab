---
- name: Validate local_rules.xml is well-formed (Wazuh allows multiple top-level <group> blocks, wrapped in fake root for validation)
  ansible.builtin.command:
    cmd: >-
      python3 -c "import xml.etree.ElementTree as ET;
      ET.fromstring('<root>' + open('{{ role_path }}/files/local_rules.xml').read() + '</root>')"
  delegate_to: localhost
  become: false
  changed_when: false

- name: Validate local_decoder.xml is well-formed (same fake-root technique)
  ansible.builtin.command:
    cmd: >-
      python3 -c "import xml.etree.ElementTree as ET;
      ET.fromstring('<root>' + open('{{ role_path }}/files/local_decoder.xml').read() + '</root>')"
  delegate_to: localhost
  become: false
  changed_when: false

- name: Deploy local_rules.xml (custom detection rules, incl. FortiGate)
  ansible.builtin.copy:
    src: local_rules.xml
    dest: /var/ossec/etc/rules/local_rules.xml
    owner: wazuh
    group: wazuh
    mode: '0660'
  notify: restart wazuh-manager

- name: Deploy local_decoder.xml (custom decoders)
  ansible.builtin.copy:
    src: local_decoder.xml
    dest: /var/ossec/etc/decoders/local_decoder.xml
    owner: wazuh
    group: wazuh
    mode: '0660'
  notify: restart wazuh-manager

- name: Deploy custom-alienvault integration wrapper
  ansible.builtin.copy:
    src: custom-alienvault
    dest: /var/ossec/integrations/custom-alienvault
    owner: root
    group: wazuh
    mode: '0750'

- name: Deploy custom-alienvault.py integration script
  ansible.builtin.copy:
    src: custom-alienvault.py
    dest: /var/ossec/integrations/custom-alienvault.py
    owner: root
    group: wazuh
    mode: '0750'

- name: Remove now-unused hardcoded api_key from ossec.conf (script reads key from sops at runtime — see Kriz #19 follow-up)
  ansible.builtin.lineinfile:
    path: /var/ossec/etc/ossec.conf
    regexp: '^\s*<api_key>.*</api_key>\s*$'
    state: absent
  notify: restart wazuh-manager

- name: Remove dead abuseipdb integration block from ossec.conf (no corresponding script ever existed — see Kriz #19 follow-up)
  ansible.builtin.replace:
    path: /var/ossec/etc/ossec.conf
    regexp: '(?s)\n?\s*<integration>\s*<name>abuseipdb</name>.*?</integration>'
    replace: ''
    backup: true
  notify: restart wazuh-manager
