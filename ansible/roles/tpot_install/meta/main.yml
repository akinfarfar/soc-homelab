galaxy_info:
  role_name: tpot_install
  description: >-
    Idempotent check-then-install wrapper around T-Pot's official
    non-interactive installer (install.sh -s -t <type> -u -p). Never
    re-runs the installer against an existing honeypot stack; fails loudly
    on inconsistent state instead of guessing.
  author: soc-homelab
  min_ansible_version: "2.14"
