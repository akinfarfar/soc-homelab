---
# roles/wazuh_install/tasks/secure_secrets.yml
# Never reads or logs contents — only checks presence and locks down
# permissions. If nothing is found, that's flagged as a note-to-self, not
# a failure.

- name: Check candidate password/cert file locations
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ wazuh_password_file_candidates }}"
  register: wazuh_password_file_stats
  become: true

- name: Lock down permissions on any password/cert files found
  ansible.builtin.file:
    path: "{{ item.item }}"
    mode: "0600"
    owner: root
    group: root
  loop: "{{ wazuh_password_file_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  become: true

- name: Warn if no password/cert backup file was found anywhere expected
  ansible.builtin.debug:
    msg: >-
      No Wazuh password/cert backup file found at any of the known candidate
      paths ({{ wazuh_password_file_candidates | join(', ') }}). If this is a
      pre-existing install, confirm by hand where admin/API credentials are
      stored (password manager, vault, etc.) before you ever need disaster
      recovery — do not assume they can be regenerated without re-running
      the installer against a live cluster.
  when: wazuh_password_file_stats.results | selectattr('stat.exists') | list | length == 0
