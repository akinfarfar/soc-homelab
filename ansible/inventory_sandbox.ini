[wazuh]
wazuh-sandbox ansible_host=10.10.10.10 ansible_user=administrator ansible_port=22

[misp]
misp-sandbox ansible_host=10.10.10.20 ansible_user=misp ansible_port=22

[tpot]
tpot-sandbox ansible_host=192.168.20.10 ansible_user=tadmin ansible_port=64295 ansible_ssh_private_key_file=/home/administrator/.ssh/tpot_ed25519

[fortigate]
fortigate-sandbox ansible_host=10.10.10.1 ansible_user=admin ansible_port=22

[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
