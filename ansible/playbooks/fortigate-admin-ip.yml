---
# playbooks/fortigate-admin-ip.yml
- name: Ensure FortiGate kalo-admin address object matches current admin_ip
  hosts: fortigate
  connection: httpapi
  gather_facts: false
  vars:
    ansible_network_os: fortinet.fortios.fortios
    ansible_httpapi_use_ssl: true
    ansible_httpapi_validate_certs: false
    ansible_httpapi_port: 443
  roles:
    - fortigate_admin_ip
