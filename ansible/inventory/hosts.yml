all:
  children:
    tpot:
      hosts:
        tpot-server:
          ansible_host: "{{ tpot_public_ip }}"
          ansible_port: 64295
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/ansible_control
    wazuh:
      hosts:
        wazuh-server:
          ansible_host: "{{ wazuh_public_ip }}"
          ansible_port: 22
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/ansible_control
