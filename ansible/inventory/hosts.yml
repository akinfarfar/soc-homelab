all:
  children:
    tpot:
      hosts:
        tpot-server:
          ansible_host: "{{ tpot_public_ip }}"
          ansible_port: 64295
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/ansible_control
    wazuh:
      hosts:
        wazuh-server:
          ansible_host: "{{ wazuh_public_ip }}"
          ansible_port: 22
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/ansible_control
    fortigate:
      hosts:
        fortigate-server:
          ansible_user: admin
          ansible_ssh_private_key_file: ~/.ssh/fortigate_admin
          ansible_host: "198.51.100.40"
    misp:
     hosts:
      misp-server:
       ansible_host: 198.51.100.30
       ansible_user: ubuntu
       ansible_ssh_private_key_file: ~/.ssh/ansible_control
